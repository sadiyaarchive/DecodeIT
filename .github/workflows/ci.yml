name: CI

# Runs on pull requests and on pushes to main. It uses NO secrets and never deploys.
# Do not switch this to `pull_request_target`: that would run fork code with repository secrets.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Plugin and UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run build:plugin
        # Obsolete settings must not redirect the official plugin or replace its ID.
        env:
          DECODEIT_WORKER_URL: https://override-must-be-ignored.invalid
          DECODEIT_PLUGIN_ID: override-must-be-ignored
      - name: Built plugin uses only the official service and contains no secrets
        run: pnpm run check:bundle

  worker:
    name: Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Bundle check (dry run, no deploy, no credentials)
        run: npx wrangler deploy --dry-run --outdir dist
