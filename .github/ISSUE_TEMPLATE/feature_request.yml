name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy or cost impact
      description: Would this send more data anywhere, add a service, or increase API usage? If so, describe it.
